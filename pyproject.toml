[project]
name = "comms-mcp"
version = "0.4.0"
description = "Unified fleet comms gateway - Telegram, WhatsApp baileys sidecar, Slack Socket Mode, Teams Graph. comms_ops portmanteau, allowlists, 7-day retention."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "prefab-ui>=0.14.0",
    "fastapi>=0.115",
    "slack-sdk>=3.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.21.0",
    "ruff>=0.16.0,<0.17",
    "pyright>=1.1.411",
    "pytest-cov>=7.1.0",
]

[project.scripts]
comms-mcp = "comms_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comms_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-m", "not slow", "--cov=comms_mcp", "--cov-report=term-missing", "--cov-fail-under=40"]
markers = [
    "slow: subprocess or full-stack integration (excluded from default CI)",
]

[tool.coverage.run]
omit = ["src/comms_mcp/__main__.py", "src/comms_mcp/registry.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]
