repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: biome-webapp
        name: biome (web_sota)
        entry: powershell.exe -NoProfile -File scripts/pre-commit-biome.ps1
        language: system
        types: [file]
        files: ^web_sota/src/.*\.(ts|tsx|js|jsx|json)$
        pass_filenames: false
