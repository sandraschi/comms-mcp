[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comms-mcp"
version = "0.4.0"
description = "Unified fleet comms gateway - Telegram, WhatsApp, Slack, Teams behind one comms_ops tool"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "prefab-ui>=0.14.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slack-sdk>=3.27",
]

[project.scripts]
comms-mcp = "comms_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/comms_mcp"]
